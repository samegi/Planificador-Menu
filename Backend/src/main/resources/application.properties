# ============================================
# DATASOURCE - CONEXIÓN A MYSQL
# ============================================
spring.application.name=meal_flow
spring.datasource.url=jdbc:mysql://localhost:3306/meal_flow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ginebra2021*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
# Crea o actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# MUY IMPORTANTE: Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# Mostrar consultas SQL en consola (útil para debug)
spring.jpa.show-sql=true

# Dialecto recomendado para MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# INICIALIZACIÓN DEL SCRIPT data.sql
# ============================================
# Ejecuta data.sql en cada arranque
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
